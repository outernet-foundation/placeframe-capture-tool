name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: "Override: use this CI run ID instead of looking up by SHA"
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      # Workaround: fetch-tags is broken with shallow clones
      - run: git fetch --tags origin

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Fetch CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from release-devkit==0.1.20 fetch-ci-artifacts --config release-devkit.yaml ${{ inputs.ci-run-id && format('--ci-run-id {0}', inputs.ci-run-id) || '' }}

      - name: Publish stable
        id: publish-stable
        run: uvx --from release-devkit==0.1.20 publish-stable --config release-devkit.yaml --with-apps

      # No-op events (nothing published) must not cut a release
      - name: Create GitHub Release
        if: steps.publish-stable.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from release-devkit==0.1.20 create-release --config release-devkit.yaml
