name: Release

on:
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  prerelease:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@1d7f9dadd9f4714a4a8ee689b8da146c47b1b44a
        with:
          channel: dev

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@1d7f9dadd9f4714a4a8ee689b8da146c47b1b44a
        with:
          channel: stable
