name: Release

on:
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  prerelease:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@df490c038086884d9a089f8fc6c64c6b99c4682c
        with:
          channel: dev

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@df490c038086884d9a089f8fc6c64c6b99c4682c
        with:
          channel: stable
