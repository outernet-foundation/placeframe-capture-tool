name: Merge gate

on:
  pull_request:
    branches: [dev]
    types: [labeled]

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}

permissions:
  contents: read
  packages: write

jobs:
  merge-gate:
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/merge-gate.yml@5031d87a6edf64ed0ecb0f381364483b4bb41dca
    secrets:
      merge-bot-private-key: ${{ secrets.MERGE_BOT_APP_PRIVATE_KEY }}
