name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

# Cancel superseded runs on the same branch, except main — where publish-stable
# must never die mid-release (overlapping release merges queue instead).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  RELEASE_DEVKIT_VERSION: 0.1.25
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/cache
  BUILDS_REGISTRY: ghcr.io/${{ github.repository }}/builds

jobs:
  mirror:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - shell: bash
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: uv run mirror

  check:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run preflight-python
      - run: uv run openapi-client-codegen --config openapi-client-codegen.yaml --check
      - id: version
        run: echo "version=$(uvx --from release-devkit==${{ env.RELEASE_DEVKIT_VERSION }} app-build-version --app capture-tool)" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: uvx --from release-devkit==${{ env.RELEASE_DEVKIT_VERSION }} publish-stable --dry-run

  unity-matrix:
    if: github.ref != 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      license-tag: ${{ steps.matrix.outputs.license-tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          save-cache: "false"
      - id: matrix
        run: uv run build-unity-matrix >> "$GITHUB_OUTPUT"

  unity:
    if: github.ref != 'refs/heads/main'
    needs: [check, unity-matrix]
    permissions:
      contents: read
      packages: write
    runs-on:
      - self-hosted
      - unity
    container: ${{ matrix.editor-image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.unity-matrix.outputs.matrix) }}
    steps:
      - name: Wipe workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          rm -rf ~/.cache/Unity
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          save-cache: "false"
      - run: >-
          uv run ci-build-unity
          --project ${{ matrix.project-name }} --platform ${{ matrix.platform }}
          --cache-key ${{ matrix.cache-key }} --run-number ${{ github.run_number }}
          --branch "$BRANCH" --registry "$CACHE_REGISTRY" --builds-registry "$BUILDS_REGISTRY"
          --version "$BUILD_VERSION"
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          CI_REGISTRY_TOKEN: ${{ github.token }}
          CI_REGISTRY_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          LICENSE_CACHE_TAG: ${{ needs.unity-matrix.outputs.license-tag }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

  build-zed:
    if: github.ref != 'refs/heads/main'
    needs: [check, mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: astral-sh/setup-uv@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: |
          docker buildx create --use --driver docker-container
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: uv run build --mode ci --gpu none --targets zed-capture --targets aoa-bridge --targets aoa-gateway

  ensure-release-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - shell: bash
        run: uvx --from release-devkit==${{ env.RELEASE_DEVKIT_VERSION }} ensure-release-pr

  publish-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v7
      - shell: bash
        run: uvx --from release-devkit==${{ env.RELEASE_DEVKIT_VERSION }} publish-stable --with-apps --fetch-ci-artifacts
        env:
          NPM_CONFIG_LOGLEVEL: verbose
