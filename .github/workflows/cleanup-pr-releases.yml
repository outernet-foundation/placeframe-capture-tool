name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@5031d87a6edf64ed0ecb0f381364483b4bb41dca
    with:
      pr-number: ${{ github.event.pull_request.number }}
