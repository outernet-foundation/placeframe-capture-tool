name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@4aa3a68c350591d105f118f7527c2b12b13b7de0
    with:
      pr-number: ${{ github.event.pull_request.number }}
