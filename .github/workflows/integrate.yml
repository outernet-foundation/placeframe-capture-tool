name: Integrate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mirror-images:
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/mirror.yml@33846e0ba25689e375982f3319716b90109b47fc

  preflight:
    needs: [mirror-images]
    permissions:
      contents: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/preflight.yml@33846e0ba25689e375982f3319716b90109b47fc

  build-unity:
    needs: [preflight]
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/build-unity.yml@33846e0ba25689e375982f3319716b90109b47fc
    secrets:
      unity-email: ${{ secrets.UNITY_EMAIL }}
      unity-password: ${{ secrets.UNITY_PASSWORD }}
      unity-serial: ${{ secrets.UNITY_SERIAL }}

  build-docker:
    needs: [preflight]
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/build-docker.yml@33846e0ba25689e375982f3319716b90109b47fc

  release-pr-builds:
    needs: [build-unity, build-docker]
    permissions:
      contents: write
      packages: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/release-pr-builds.yml@33846e0ba25689e375982f3319716b90109b47fc
