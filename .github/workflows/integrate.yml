name: Integrate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mirror-images:
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/mirror.yml@44bcf9be6f4456ba978ae4e1438be9e8fbf35a32

  preflight:
    needs: [mirror-images]
    permissions:
      contents: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/preflight.yml@44bcf9be6f4456ba978ae4e1438be9e8fbf35a32

  build-unity:
    needs: [preflight]
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/build-unity.yml@44bcf9be6f4456ba978ae4e1438be9e8fbf35a32
    secrets:
      unity-email: ${{ secrets.UNITY_EMAIL }}
      unity-password: ${{ secrets.UNITY_PASSWORD }}
      unity-serial: ${{ secrets.UNITY_SERIAL }}
      android-keystore: ${{ secrets.ANDROID_KEYSTORE }}
      android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  build-docker:
    needs: [preflight]
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/build-docker.yml@44bcf9be6f4456ba978ae4e1438be9e8fbf35a32

  release-pr-builds:
    needs: [build-unity, build-docker]
    permissions:
      contents: write
      packages: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/release-pr-builds.yml@44bcf9be6f4456ba978ae4e1438be9e8fbf35a32
