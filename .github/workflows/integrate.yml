name: Integrate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, ready_for_review]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rebase:
    permissions:
      contents: write
      pull-requests: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/rebase.yml@29cb178425af3889a775408dbe9e84ff0441e945

  mirror-images:
    needs: [rebase]
    if: ${{ needs.rebase.outputs.mode == 'full' }}
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/mirror.yml@29cb178425af3889a775408dbe9e84ff0441e945

  preflight:
    needs: [rebase, mirror-images]
    if: ${{ needs.rebase.outputs.mode == 'full' }}
    permissions:
      contents: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/preflight.yml@29cb178425af3889a775408dbe9e84ff0441e945

  build-unity:
    needs: [rebase, preflight]
    if: ${{ needs.rebase.outputs.mode == 'full' }}
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/build-unity.yml@29cb178425af3889a775408dbe9e84ff0441e945
    secrets:
      unity-email: ${{ secrets.UNITY_EMAIL }}
      unity-password: ${{ secrets.UNITY_PASSWORD }}
      unity-serial: ${{ secrets.UNITY_SERIAL }}
      android-keystore: ${{ secrets.ANDROID_KEYSTORE }}
      android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  build-docker:
    needs: [rebase, preflight]
    if: ${{ needs.rebase.outputs.mode == 'full' }}
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/build-docker.yml@29cb178425af3889a775408dbe9e84ff0441e945

  release-pr-builds:
    needs: [rebase, build-unity, build-docker]
    if: ${{ needs.rebase.outputs.mode == 'full' }}
    permissions:
      contents: write
      packages: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/release-pr-builds.yml@29cb178425af3889a775408dbe9e84ff0441e945

  merge-if-ready:
    needs: [rebase, release-pr-builds]
    if: ${{ !cancelled() && !failure() && (needs.release-pr-builds.result == 'success' || needs.rebase.outputs.mode == 'reuse') }}
    permissions:
      contents: write
      pull-requests: read
      packages: write
    concurrency:
      group: merge
      queue: max
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/merge-if-ready.yml@29cb178425af3889a775408dbe9e84ff0441e945
    secrets:
      merge-bot-private-key: ${{ secrets.MERGE_BOT_APP_PRIVATE_KEY }}
