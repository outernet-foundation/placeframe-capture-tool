name: Integrate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mirror-images:
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/mirror.yml@b19b471ea6ee491753630bd2fbbb24d7b9c090b9

  preflight:
    needs: [mirror-images]
    permissions:
      contents: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/preflight.yml@b19b471ea6ee491753630bd2fbbb24d7b9c090b9

  build-unity:
    needs: [preflight]
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/build-unity.yml@b19b471ea6ee491753630bd2fbbb24d7b9c090b9
    secrets:
      unity-email: ${{ secrets.UNITY_EMAIL }}
      unity-password: ${{ secrets.UNITY_PASSWORD }}
      unity-serial: ${{ secrets.UNITY_SERIAL }}

  build-docker:
    needs: [preflight]
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/build-docker.yml@b19b471ea6ee491753630bd2fbbb24d7b9c090b9

  release-pr-builds:
    needs: [build-unity, build-docker]
    permissions:
      contents: write
      packages: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/release-pr-builds.yml@b19b471ea6ee491753630bd2fbbb24d7b9c090b9
