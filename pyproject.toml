[project]
name = "placeframe-capture-tool"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "scripts",
    # The zed tree is lint/type-clean against these linter lines; newer majors add rules it fails
    "basedpyright>=1.39.10,<1.40",
    "ruff>=0.14.11,<0.15",
    "pytest>=8.0.0",
    "bashrun>=0.8",
    "docker-devkit>=0.4",
    "openapi-client-codegen>=0.3",
    "python-devkit>=0.3",
    "unity-devkit>=0.3",
]

[tool.uv.workspace]
members = ["workloads/aoa-bridge", "workloads/zed-capture", "scripts"]

[tool.uv]
required-version = "==0.12.15"

[tool.uv.sources]
scripts = { workspace = true }

[tool.python-devkit.preflight]
sync-args = ["--all-packages"]
deptry-exclude = ["packages/generated/*"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = [
    "workloads/**/src/**/*.py",
    "workloads/**/src/**/*.pyi",
    "scripts/**/src/**/*.py",
    "scripts/**/src/**/*.pyi",
]

[tool.pytest.ini_options]
testpaths = ["workloads/zed-capture/tests"]
