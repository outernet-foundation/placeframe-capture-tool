[project]
name = "placeframe-capture-tool"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "scripts",
    # Bounded to placeframe's locked linter versions: the moved zed tree is
    # lint/type-clean against them, newer majors add rules it fails.
    "basedpyright>=1.39.10,<1.40",
    "ruff>=0.14.11,<0.15",
    "pytest>=8.0.0",
    "docker-devkit>=0.1.0",
    "unity-devkit>=0.1.0",
    "openapi-client-codegen>=0.1.0",
    "python-devkit>=0.1.0",
]

[tool.uv.workspace]
members = ["docker/aoa-bridge", "docker/zed-capture", "scripts"]

[tool.uv]
required-version = "==0.12.15"

[tool.uv.sources]
scripts = { workspace = true }

[tool.python-devkit.preflight]
sync-args = ["--all-packages"]
deptry-exclude = ["packages/generated/*"]

[tool.docker-devkit.lifecycle]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = [
    "docker/**/src/**/*.py",
    "docker/**/src/**/*.pyi",
    "scripts/**/src/**/*.py",
    "scripts/**/src/**/*.pyi",
]

[tool.pytest.ini_options]
testpaths = ["docker/zed-capture/tests"]
