# x-base-images is the single declaration home for every third-party image this
# repo consumes — Dockerfile bases AND runtime images pulled by compose (the
# `*_IMAGE` keys feed compose image holes via .env.lock).
x-base-images:
  ZED_BASE_IMAGE: "ghcr.io/outernet-foundation/mirror/docker.io/stereolabs/zed:5.2-runtime-jetson-jp6.1.0"
  ZED_DEVEL_IMAGE: "ghcr.io/outernet-foundation/mirror/docker.io/stereolabs/zed:5.2-tools-devel-jetson-jp6.1.0"
  CADDY_IMAGE: "ghcr.io/outernet-foundation/mirror/docker.io/library/caddy:2.8.4-alpine"
  UV_BASE_IMAGE: "ghcr.io/outernet-foundation/mirror/ghcr.io/astral-sh/uv:0.12.15-python3.13-trixie-slim"
  PYTHON_BASE_IMAGE: "ghcr.io/outernet-foundation/mirror/docker.io/library/python:3.13-slim@sha256:dc1546eefcbe8caaa1f004f16ab76b204b5e1dbd58ff81b899f21cd40541232f"
  LOKI_IMAGE: "ghcr.io/outernet-foundation/mirror/docker.io/grafana/loki:3.5.0"
  ALLOY_IMAGE: "ghcr.io/outernet-foundation/mirror/docker.io/grafana/alloy:v1.9.0"

x-base-args: &base-args
  ZED_BASE_IMAGE: "${ZED_BASE_IMAGE:-}"
  ZED_DEVEL_IMAGE: "${ZED_DEVEL_IMAGE:-}"
  CADDY_IMAGE: "${CADDY_IMAGE:-}"
  UV_BASE_IMAGE: "${UV_BASE_IMAGE:-}"
  PYTHON_BASE_IMAGE: "${PYTHON_BASE_IMAGE:-}"

x-registry-cache: ghcr.io/outernet-foundation/placeframe-capture-tool/build-cache

x-cross-compile-targets:
  - zed-capture

services:
  zed-capture:
    build:
      context: .
      dockerfile: docker/zed-capture/Dockerfile
      platforms: [ "linux/arm64" ]
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/zed-capture:latest"
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/zed-capture:${ZED_CAPTURE_SHA}"
  aoa-bridge:
    build:
      context: .
      dockerfile: docker/aoa-bridge/Dockerfile
      platforms: [ "linux/arm64" ]
      args:
        UV_BASE_IMAGE: "${UV_BASE_IMAGE:-}"
        PYTHON_BASE_IMAGE: "${PYTHON_BASE_IMAGE:-}"
      tags:
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/aoa-bridge:latest"
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/aoa-bridge:${AOA_BRIDGE_SHA}"
  aoa-gateway:
    build:
      context: .
      dockerfile: docker/aoa-gateway/Dockerfile
      platforms: [ "linux/arm64" ]
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/aoa-gateway:latest"
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/aoa-gateway:${AOA_GATEWAY_SHA}"
