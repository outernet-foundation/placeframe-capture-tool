requires: ">=0.7.1"
project_name: placeframe-capture-tool
repository: ghcr.io/outernet-foundation/placeframe-capture-tool
platforms:
  - linux/arm64
base_images:
  ZED_BASE_IMAGE: "docker.io/stereolabs/zed:5.2-runtime-jetson-jp6.1.0"
  ZED_DEVEL_IMAGE: "docker.io/stereolabs/zed:5.2-tools-devel-jetson-jp6.1.0"
  AOA_GATEWAY_IMAGE: "docker.io/library/caddy:2.8.4-alpine"
  UV_BASE_IMAGE: "ghcr.io/astral-sh/uv:0.12.15-python3.13-trixie-slim"
  PYTHON_BASE_IMAGE: "docker.io/library/python:3.13-slim"
  LOKI_IMAGE: "docker.io/grafana/loki:3.5.0"
  ALLOY_IMAGE: "docker.io/grafana/alloy:v1.9.0"

services:
  zed:
    options:
      capture:
        workloads:
          - zed-capture.yaml
  aoa:
    options:
      bridge:
        workloads:
          - aoa-bridge.yaml
      gateway:
        workloads:
          - aoa-gateway.yaml
