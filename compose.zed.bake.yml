x-base-images:
  ZED_BASE_DIGEST: "ghcr.io/outernet-foundation/mirror/docker.io/stereolabs/zed:5.2-runtime-jetson-jp6.1.0"
  CADDY_DIGEST: "ghcr.io/outernet-foundation/mirror/docker.io/library/caddy:2.8.4-alpine"
  UV_BASE_DIGEST: "ghcr.io/outernet-foundation/mirror/ghcr.io/astral-sh/uv:0.12.15-python3.13-trixie-slim"
  PYTHON_BASE_DIGEST: "ghcr.io/outernet-foundation/mirror/docker.io/library/python:3.13-slim@sha256:dc1546eefcbe8caaa1f004f16ab76b204b5e1dbd58ff81b899f21cd40541232f"

x-base-args: &base-args
  ZED_BASE_DIGEST: "${ZED_BASE_DIGEST:-}"
  CADDY_DIGEST: "${CADDY_DIGEST:-}"
  UV_BASE_DIGEST: "${UV_BASE_DIGEST:-}"
  PYTHON_BASE_DIGEST: "${PYTHON_BASE_DIGEST:-}"

x-registry-cache: ghcr.io/outernet-foundation/placeframe-capture-tool/build-cache

x-cross-compile-targets:
  - zed-capture

services:
  zed-capture:
    build:
      context: .
      dockerfile: docker/zed-capture/Dockerfile
      platforms: [ "linux/arm64" ]
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/zed-capture:latest"
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/zed-capture:${ZED_CAPTURE_SHA}"
  aoa-bridge:
    build:
      context: .
      dockerfile: docker/aoa-bridge/Dockerfile
      platforms: [ "linux/arm64" ]
      args:
        UV_BASE_DIGEST: "${UV_BASE_DIGEST:-}"
        PYTHON_BASE_DIGEST: "${PYTHON_BASE_DIGEST:-}"
      tags:
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/aoa-bridge:latest"
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/aoa-bridge:${AOA_BRIDGE_SHA}"
  aoa-gateway:
    build:
      context: .
      dockerfile: docker/aoa-gateway/Dockerfile
      platforms: [ "linux/arm64" ]
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/aoa-gateway:latest"
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/aoa-gateway:${AOA_GATEWAY_SHA}"
  loki:
    build:
      context: .
      dockerfile: docker/loki/Dockerfile
      platforms: [ "linux/arm64" ]
      args:
        LOKI_DIGEST: "${LOKI_DIGEST:-}"
      tags:
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/loki:latest"
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/loki:${LOKI_SHA}"
  alloy:
    build:
      context: .
      dockerfile: docker/alloy/Dockerfile
      platforms: [ "linux/arm64" ]
      args:
        ALLOY_DIGEST: "${ALLOY_DIGEST:-}"
      tags:
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/alloy:latest"
        - "ghcr.io/outernet-foundation/placeframe-capture-tool/alloy:${ALLOY_SHA}"
