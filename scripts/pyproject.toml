[project]
name = "scripts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "boatyard>=0.7.1",
    "placeframe-common==2.0.0.dev1340",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripts"]

[project.scripts]
install-zed = "scripts.install_zed.orchestrator:app"

[tool.deptry.per_rule_ignores]
DEP002 = ["boatyard"]
