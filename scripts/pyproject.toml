[project]
name = "scripts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "docker-devkit>=0.1.0",
    "placeframe-common==0.1.0.dev35815669170",
    "typer>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripts"]

[project.scripts]
install-zed = "scripts.install_zed.orchestrator:app"
